<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vault Fantasy</title>
<!--
  GitHub Pages single-page-app fallback.
  Vault is one index.html with client-side routing (/teamreview, /calc, …).
  When someone hits a clean route directly (bookmark, refresh, shared link),
  GitHub Pages can't find a file at that path and serves this 404 page.
  We bounce to /?/<original-path>; the decode snippet in index.html's <head>
  rewrites that back to the clean URL before the app boots. Apex custom
  domain → the app lives at the root, so keep 0 path segments.
  Technique: rafgraph/spa-github-pages (MIT).
-->
<script>
  var pathSegmentsToKeep = 0;
  var l = window.location;
  l.replace(
    l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
    l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
    l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
    (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
    l.hash
  );
</script>
</head>
<body></body>
</html>
