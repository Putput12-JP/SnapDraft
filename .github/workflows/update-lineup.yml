# Refresh the Lineup Command projection feed.
# In-season: every 6h as a baseline, plus hourly through the game windows
# (Thu/Sun/Mon, 13:00–23:00 UTC ≈ 9am–7pm ET) so projections track
# late-breaking news. Offseason: once daily — see the credit budget below.
# Matches the repo's scripts/ + data/ + workflows pattern.
# Place at: .github/workflows/update-lineup.yml

name: Update Lineup projections

on:
  schedule:
    # ── ParlayAPI credit budget ──────────────────────────────────────────
    # Each run costs 6 ParlayAPI credits: 2 requests (/odds + /props) billed
    # at 3 credits each. Measured over Jul 2026 — 140 runs → 840 credits,
    # exactly 6.0/run. The FREE tier is 1,000 credits/month, so the entire
    # year has to fit inside ~166 runs/month.
    #
    # OFFSEASON (Feb–Aug) — once daily.
    # Season-opener lines move a few times a WEEK, so the old year-round
    # '0 */6' + hourly-game-window schedule burned ~70% of the monthly budget
    # re-fetching numbers that hadn't changed. 1/day ≈ 180 credits/month.
    - cron: '0 9 * 2,3,4,5,6,7,8 *'
    #
    # IN-SEASON (Sep–Jan) — unchanged for now.
    # WARNING: this is ~172 runs ≈ 1,032 credits/month and does NOT fit the
    # free tier. Before Week 1, either upgrade ($5/mo) or trim to a daily
    # baseline + a 15-23 UTC game window (~146 runs ≈ 876 credits/month).
    - cron: '0 */6 * 9,10,11,12,1 *'
    - cron: '0 13-23 * 9,10,11,12,1 0,1,4'
  workflow_dispatch: {}        # manual "Run workflow" button

# Two cron entries both match 18:00 UTC on Sun/Mon/Thu in-season. Serialize so
# the overlapping runs can't race on data/lineup-feed.json and trip the push
# retry loop below. (This is a git-safety fix, not a credit saving — a queued
# run still executes and still costs its 6 credits.)
concurrency:
  group: lineup-feed
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build projection feed
        run: node scripts/build-lineup-feed.mjs
        env:
          # Optional: live Vegas team totals via The Odds API (markets=spreads,totals).
          # Add repo secret ODDS_API_KEY to enable. Without it, Vegas falls back to
          # ESPN's free scoreboard, then to the preseason workbook baseline.
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          # Optional: weekly PLAYER PROPS + game lines via ParlayAPI (or The Odds API).
          # ParlayAPI provides BOTH game odds and props from one key — when set, the
          # feed routes everything through it (10+ books incl. DFS). Dormant if unset.
          #   ParlayAPI (recommended): set PROPS_API_KEY only — host defaults to
          #     parlay-api.com (v1 base, X-API-Key header, flat /props endpoint).
          #   The Odds API instead:    set PROPS_API_HOST=api.the-odds-api.com
          PROPS_API_KEY: ${{ secrets.PROPS_API_KEY }}
          # PARLAY_API_KEY accepted as an alias so either secret name works.
          PARLAY_API_KEY: ${{ secrets.PARLAY_API_KEY }}
          PROPS_API_HOST: ${{ vars.PROPS_API_HOST }}
      - name: Commit refreshed feed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/lineup-feed.json
          if git diff --staged --quiet; then
            echo "No change in feed."
          else
            git commit -m "data: refresh Lineup projections feed"
            # Rebase on the latest main before pushing so overlapping/re-run jobs
            # never fail with "fetch first" (remote moved ahead). Retry once.
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push && break
              echo "push race, retrying ($i)…"; sleep 3
            done
          fi
