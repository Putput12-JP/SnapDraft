# Refresh the Lineup Command projection feed (also pulls ParlayAPI game odds +
# player props). In-season: a daily baseline plus hourly through the Sun/Mon/Thu
# game windows, sized to the full free credit budget (see below). Offseason:
# once daily. Matches the repo's scripts/ + data/ + workflows pattern.
# Place at: .github/workflows/update-lineup.yml

name: Update Lineup projections

on:
  schedule:
    # ── ParlayAPI credit budget ──────────────────────────────────────────
    # Each run costs 6 ParlayAPI credits: 2 requests (/odds + /props) billed
    # at 3 credits each. Measured over Jul 2026 — 140 runs → 840 credits,
    # exactly 6.0/run. The FREE tier is 1,000 credits/month, so every month
    # must fit inside ~166 runs. This whole schedule is sized to stay under
    # that cap year-round, so the free plan is enough — no upgrade needed.
    #
    # OFFSEASON (Feb–Aug) — once daily. ~30 runs ≈ 180 credits/month.
    # In preseason ParlayAPI /props returns empty until books post player
    # props; the free keyless PrizePicks workflow (update-props.yml) fills
    # vegas_player_props in the meantime, and build-lineup-feed automatically
    # swaps in the real ParlayAPI books the moment /props starts returning them.
    - cron: '0 9 * 2,3,4,5,6,7,8 *'
    #
    # IN-SEASON (Sep–Jan) — sized to the FULL free budget. The busiest month
    # (Nov 2026: 5 Sun + 5 Mon + 4 Thu) lands at 166 runs = 996 credits, which
    # is the most whole 6-credit runs that fit under 1,000 (167 = 1,002, over).
    # Hourly through the windows where lines + props actually move; one daily
    # baseline otherwise. Per-month runs, measured on the 2026 season:
    #   Sep 146 · Oct 156 · Nov 166 · Dec 156 · Jan 158  (876–996 credits)
    #   daily baseline (all days)       08 UTC
    #   Sunday main slate  13–23 UTC    +11 runs
    #   Mon + Thu pregame  15–23 UTC    +9 runs
    - cron: '0 8 * 9,10,11,12,1 *'
    - cron: '0 13-23 * 9,10,11,12,1 0'
    - cron: '0 15-23 * 9,10,11,12,1 1,4'
  workflow_dispatch: {}        # manual "Run workflow" button

# Adjacent hourly pregame-window runs (and a manual workflow_dispatch) can
# overlap on data/lineup-feed.json. Serialize so they can't race and trip the
# push retry loop below. (Git-safety only, not a credit saving — a queued run
# still executes and still costs its 6 credits.)
concurrency:
  group: lineup-feed
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Build projection feed
        run: |
          node scripts/build-lineup-feed.mjs
        env:
          # Optional: live Vegas team totals via The Odds API (markets=spreads,totals).
          # Add repo secret ODDS_API_KEY to enable. Without it, Vegas falls back to
          # ESPN's free scoreboard, then to the preseason workbook baseline.
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          # Optional: weekly PLAYER PROPS + game lines via ParlayAPI (or The Odds API).
          # ParlayAPI provides BOTH game odds and props from one key — when set, the
          # feed routes everything through it (10+ books incl. DFS). Dormant if unset.
          #   ParlayAPI (recommended): set PROPS_API_KEY only — host defaults to
          #     parlay-api.com (v1 base, X-API-Key header, flat /props endpoint).
          #   The Odds API instead:    set PROPS_API_HOST=api.the-odds-api.com
          PROPS_API_KEY: ${{ secrets.PROPS_API_KEY }}
          # PARLAY_API_KEY accepted as an alias so either secret name works.
          PARLAY_API_KEY: ${{ secrets.PARLAY_API_KEY }}
          PROPS_API_HOST: ${{ vars.PROPS_API_HOST }}
      - name: Commit refreshed feed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/lineup-feed.json
          if git diff --staged --quiet; then
            echo "No change in feed."
          else
            git commit -m "data: refresh Lineup projections feed"
            # Rebase on the latest main before pushing so overlapping/re-run jobs
            # never fail with "fetch first" (remote moved ahead). Retry once.
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push && break
              echo "push race, retrying ($i)…"; sleep 3
            done
          fi
