# Refresh the Lineup Command projection feed.
# Every 6h as a baseline, plus hourly through the game windows
# (Thu/Sun/Mon, 13:00–23:00 UTC ≈ 9am–7pm ET) so projections track
# late-breaking news. Matches the repo's scripts/ + data/ + workflows pattern.
# Place at: .github/workflows/update-lineup.yml

name: Update Lineup projections

on:
  schedule:
    - cron: '0 */6 * * *'        # baseline: every 6 hours
    - cron: '0 13-23 * * 0,1,4'  # hourly during Sun/Mon/Thu game windows
  workflow_dispatch: {}        # manual "Run workflow" button

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build projection feed
        run: node scripts/build-lineup-feed.mjs
        env:
          # Optional: live Vegas team totals via The Odds API (markets=spreads,totals).
          # Add repo secret ODDS_API_KEY to enable. Without it, Vegas falls back to
          # ESPN's free scoreboard, then to the preseason workbook baseline.
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          # Optional: weekly PLAYER PROPS + game lines via ParlayAPI (or The Odds API).
          # ParlayAPI provides BOTH game odds and props from one key — when set, the
          # feed routes everything through it (10+ books incl. DFS). Dormant if unset.
          #   ParlayAPI (recommended): set PROPS_API_KEY only — host defaults to
          #     parlay-api.com (v1 base, X-API-Key header, flat /props endpoint).
          #   The Odds API instead:    set PROPS_API_HOST=api.the-odds-api.com
          PROPS_API_KEY: ${{ secrets.PROPS_API_KEY }}
          PROPS_API_HOST: ${{ vars.PROPS_API_HOST }}
      - name: Commit refreshed feed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/lineup-feed.json
          if git diff --staged --quiet; then
            echo "No change in feed."
          else
            git commit -m "data: refresh Lineup projections feed"
            # Rebase on the latest main before pushing so overlapping/re-run jobs
            # never fail with "fetch first" (remote moved ahead). Retry once.
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push && break
              echo "push race, retrying ($i)…"; sleep 3
            done
          fi
