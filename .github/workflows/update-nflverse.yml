name: Update nflverse data

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run data processor
        run: python scripts/process_nflverse.py

      - name: Rebuild grade calibration
        # Fits Grade Keys factor weights from the freshly-written nflverse_stats_*
        # seasons (pure stdlib, no deps). Writes data/grade_calibration.json; a
        # factor/pos cell only publishes when it beats carry walk-forward, so a
        # thin/degraded run simply publishes less and the frontend keeps its
        # hand-authored constants (null-fallback).
        run: python scripts/build_grade_calibration.py

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "chore: update nflverse data $(date -u +%Y-%m-%d)"
          git push
